services:
  - type: web
    name: lightsync-official
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: lightsync-official
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
